[package]
name = "nft-staking-core"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nft_staking_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.3", features = ["init-if-needed"] }
anchor-spl = "0.32.3"
mpl-core = { version = "0.11.1", features = ["anchor"] }

[dev-dependencies]
litesvm = "0.16.0"
solana-clock = "3"
solana-instruction = "3"
solana-keypair = "3"
solana-message = "4"
solana-pubkey = "3"
solana-signer = "3"
solana-transaction = "4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
